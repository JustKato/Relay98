name: Check theme

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
      - run: npm run build
      - run: npm run build -- --format spotifast
      - run: npm run build -- --format palette
      - run: npm run build -- --variant discord
      - run: git diff --exit-code -- build/relay98.theme.css build/relay98.spotifast.json build/relay98.palette.json build/relay98-discord-dark.theme.css
