name: Release themes

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test and build theme
        run: |
          npm test
          npm run build
          npm run build -- --format spotifast
          npm run build -- --format palette
          test -s build/relay98.theme.css
          test -s build/relay98.spotifast.json
          test -s build/relay98.palette.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" build/relay98.theme.css build/relay98.spotifast.json build/relay98.palette.json \
            --verify-tag \
            --title "$TAG_NAME" \
            --generate-notes
